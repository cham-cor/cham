```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈宇涵 · 简历</title>
    <style>
        /* ===== 基础重置 & 变量 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #0f172a;
            --color-primary-light: #1e293b;
            --color-accent: #f59e0b;
            --color-accent-hover: #d97706;
            --color-accent-light: #fbbf24;
            --color-bg: #f1f5f9;
            --color-surface: #ffffff;
            --color-surface-hover: #f8fafc;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-text-muted: #94a3b8;
            --color-border: #e2e8f0;
            --color-shadow: rgba(15, 23, 42, 0.08);
            --color-shadow-hover: rgba(15, 23, 42, 0.16);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --max-width: 1120px;
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --color-primary: #f1f5f9;
            --color-primary-light: #e2e8f0;
            --color-bg: #0f172a;
            --color-surface: #1e293b;
            --color-surface-hover: #2d3a4f;
            --color-text: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-text-muted: #64748b;
            --color-border: #334155;
            --color-shadow: rgba(0, 0, 0, 0.3);
            --color-shadow-hover: rgba(0, 0, 0, 0.5);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 打印样式 ===== */
        @media print {
            :root {
                --color-bg: #ffffff;
                --color-surface: #ffffff;
                --color-text: #000000;
                --color-text-secondary: #333333;
                --color-text-muted: #666666;
                --color-border: #cccccc;
                --color-shadow: none;
                --color-shadow-hover: none;
            }
            body {
                padding-top: 0;
                background: #fff;
            }
            .nav-bar,
            .back-top,
            .print-hide {
                display: none !important;
            }
            .hero {
                padding: 40px 0 24px !important;
            }
            .card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                break-inside: avoid;
            }
            .section {
                padding: 20px 0 !important;
            }
            .tab-panel {
                display: block !important;
            }
            .tab-btn {
                display: none !important;
            }
            .tab-content .tab-panel {
                display: block !important;
            }
            .tab-bar {
                display: none !important;
            }
            .skill-bar-fill {
                background: #333 !important;
            }
            .badge {
                border: 1px solid #999 !important;
                background: #f5f5f5 !important;
                color: #000 !important;
            }
            .contact-btn {
                border: 1px solid #333 !important;
                background: #fff !important;
                color: #000 !important;
            }
            .highlight-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }
            .project-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
            .footer {
                border-top: 1px solid #ddd !important;
            }
            .skill-item .skill-bar-track {
                background: #eee !important;
            }
            .avatar {
                border: 2px solid #333 !important;
            }
        }

        /* ===== 通用 ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        .section {
            padding: 48px 0;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--color-accent), transparent);
            opacity: 0.4;
        }

        .card {
            background: var(--color-surface);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px var(--color-shadow);
            padding: 24px 28px;
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px var(--color-shadow-hover);
        }

        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--color-accent);
            color: #0f172a;
            letter-spacing: 0.01em;
        }
        .badge-outline {
            background: transparent;
            border: 1.5px solid var(--color-border);
            color: var(--color-text-secondary);
        }
        .badge-accent {
            background: var(--color-accent);
            color: #0f172a;
        }

        .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 500;
            background: var(--color-border);
            color: var(--color-text-secondary);
            transition: background var(--transition), color var(--transition);
        }

        .text-muted {
            color: var(--color-text-muted);
        }
        .text-secondary {
            color: var(--color-text-secondary);
        }
        .text-accent {
            color: var(--color-accent);
        }

        /* ===== 导航栏 ===== */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--color-border);
            transition: background var(--transition), border-color var(--transition);
            display: flex;
            align-items: center;
        }
        [data-theme="dark"] .nav-bar {
            background: rgba(15, 23, 42, 0.78);
        }

        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            color: var(--color-text);
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-brand span {
            color: var(--color-accent);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 100px;
            transition: background var(--transition), color var(--transition);
        }
        .nav-links a:hover {
            background: var(--color-accent);
            color: #0f172a;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            font-size: 1.1rem;
            transition: background var(--transition), color var(--transition);
            padding: 0;
        }
        .nav-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        /* ===== Hero ===== */
        .hero {
            padding: 60px 0 40px;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -20%;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08), transparent 70%);
            pointer-events: none;
        }
        .hero-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--color-accent);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
            margin-bottom: 16px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .hero-left h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .hero-left h1 span {
            color: var(--color-accent);
        }
        .hero-left .subtitle {
            font-size: 1.05rem;
            color: var(--color-text-secondary);
            margin-bottom: 16px;
        }
        .hero-left .bio {
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            max-width: 480px;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 24px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            background: var(--color-accent);
            color: #0f172a;
        }
        .contact-btn:hover {
            background: var(--color-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
        }
        .contact-btn-outline {
            background: transparent;
            border: 1.5px solid var(--color-border);
            color: var(--color-text);
        }
        .contact-btn-outline:hover {
            background: var(--color-border);
            transform: translateY(-2px);
            box-shadow: none;
        }

        .hero-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--color-surface);
            border-radius: var(--radius);
            padding: 28px 32px;
            box-shadow: 0 4px 24px var(--color-shadow);
            border: 1px solid var(--color-border);
            transition: background var(--transition), border-color var(--transition);
        }
        .hero-right .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--color-border);
        }
        .hero-right .stat-item:last-child {
            border-bottom: none;
        }
        .hero-right .stat-label {
            font-weight: 500;
            color: var(--color-text-secondary);
            font-size: 0.85rem;
        }
        .hero-right .stat-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--color-accent);
        }

        /* ===== 亮点成果区 ===== */
        .highlight-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            padding: 20px 20px 18px;
            text-align: center;
            border: 1px solid var(--color-border);
            transition: all var(--transition);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px var(--color-shadow-hover);
            border-color: var(--color-accent);
        }
        .highlight-card .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-accent);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .highlight-card .label {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        /* ===== Tabs ===== */
        .tab-bar {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--color-border);
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 0;
            flex-wrap: nowrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font);
            border-radius: 0;
            position: relative;
        }
        .tab-btn:hover {
            color: var(--color-text);
            background: var(--color-surface-hover);
        }
        .tab-btn[aria-selected="true"] {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent);
        }
        .tab-btn[aria-selected="true"]::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--color-accent);
            border-radius: 4px;
        }

        .tab-panel {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .tab-panel[aria-hidden="false"] {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 经历条目 ===== */
        .exp-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--color-border);
        }
        .exp-item:last-child {
            border-bottom: none;
        }
        .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }
        .exp-title {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .exp-org {
            color: var(--color-text-secondary);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .exp-date {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            font-weight: 500;
        }
        .exp-desc {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
        }
        .exp-desc li {
            padding: 3px 0 3px 20px;
            position: relative;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }
        .exp-desc li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
        }
        .exp-desc li strong {
            color: var(--color-text);
            font-weight: 600;
        }

        /* ===== 项目卡片 ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            padding: 22px 24px 24px;
            border: 1px solid var(--color-border);
            transition: all var(--transition);
            box-shadow: 0 2px 8px var(--color-shadow);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px var(--color-shadow-hover);
            border-color: var(--color-accent);
        }
        .project-card .p-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 2px;
        }
        .project-card .p-role {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }
        .project-card .p-desc {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            flex: 1;
        }
        .project-card .p-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 12px 0 10px;
        }
        .project-card .p-result {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-accent);
            border-top: 1px solid var(--color-border);
            padding-top: 10px;
            margin-top: 4px;
        }

        /* ===== 技能矩阵 ===== */
        .skill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
        }
        .skill-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .skill-item .skill-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .skill-item .skill-label span:last-child {
            color: var(--color-text-muted);
            font-weight: 400;
        }
        .skill-bar-track {
            width: 100%;
            height: 6px;
            border-radius: 12px;
            background: var(--color-border);
            overflow: hidden;
        }
        .skill-bar-fill {
            height: 100%;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--color-accent-light), var(--color-accent));
            width: 0%;
            transition: width 0.8s ease;
        }

        /* ===== 教育&证书 ===== */
        .edu-cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .edu-card,
        .cert-card {
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            padding: 22px 24px;
            border: 1px solid var(--color-border);
            transition: all var(--transition);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .edu-card:hover,
        .cert-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 32px var(--color-shadow-hover);
        }
        .edu-card .school {
            font-weight: 700;
            font-size: 1.05rem;
        }
        .edu-card .major {
            color: var(--color-text-secondary);
            font-size: 0.9rem;
        }
        .edu-card .meta {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 4px;
        }
        .edu-card .courses {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 8px;
            line-height: 1.5;
        }
        .cert-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.9rem;
        }
        .cert-item:last-child {
            border-bottom: none;
        }
        .cert-item .cert-name {
            font-weight: 500;
        }
        .cert-item .cert-date {
            color: var(--color-text-muted);
            font-size: 0.8rem;
        }

        /* ===== 页脚 ===== */
        .footer {
            padding: 32px 0 24px;
            border-top: 1px solid var(--color-border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }
        .footer a {
            color: var(--color-accent);
            text-decoration: none;
        }

        /* ===== 返回顶部 ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--color-accent);
            color: #0f172a;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
            transition: all var(--transition);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.45);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 900px) {
            .hero-inner {
                grid-template-columns: 1fr;
                gap: 28px;
            }
            .hero-left h1 {
                font-size: 2.2rem;
            }
            .skill-grid {
                grid-template-columns: 1fr;
            }
            .edu-cert-grid {
                grid-template-columns: 1fr;
            }
            .project-grid {
                grid-template-columns: 1fr;
            }
            .highlight-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .hero-right {
                padding: 20px 24px;
            }
            .avatar {
                width: 80px;
                height: 80px;
            }
        }

        @media (max-width: 640px) {
            .nav-inner {
                flex-wrap: wrap;
                gap: 6px;
                padding: 0 16px;
            }
            .nav-links {
                gap: 4px;
                order: 3;
                width: 100%;
                justify-content: center;
                padding-top: 4px;
            }
            .nav-links a {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            .nav-brand {
                font-size: 0.95rem;
            }
            .hero {
                padding: 32px 0 24px;
            }
            .hero-left h1 {
                font-size: 1.8rem;
            }
            .highlight-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .highlight-card .number {
                font-size: 1.5rem;
            }
            .section {
                padding: 32px 0;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .card {
                padding: 16px 18px;
            }
            .exp-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 0.78rem;
            }
            .hero-right .stat-item {
                flex-direction: column;

        // ---- Tab 切换 ----

                b.setAttribute('tabindex', i === idx ? '0' : '-1');

            const panels = $$('.tab-panel', content);
            panels.forEach((p, i) => {
                p.setAttribute('aria-hidden', i === idx ? 'false' : 'true');

                            <span class="cert-name">${c.name}</span>
                            <span class="cert-date">${c.issuer} ${c.year ? '· '+c.year : ''}</span>
                        </div>
                    `).join('') : '<div class="text-muted" style="font-size:0.85rem;">暂无证书信息</div>'}
                </div>
            `;
            container.innerHTML = html;
        }

        // ---- 更新时间 ----
        function setUpdateTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            $('#updateTime').textContent = `${y}-${m}-${d}`;
        }

        // ---- 邮箱/电话复制 ----
        function setupContactButtons() {
            $('#emailBtn').addEventListener('click', () => {
                const email = resume.email;
                navigator.clipboard.writeText(email).then(() => {
                    const orig = $('#emailBtn').textContent;
                    $('#emailBtn').textContent = '✅ 已复制';
                    setTimeout(() => { $('#emailBtn').textContent = orig; }, 1800);
                }).catch(() => {
                    // fallback
                    const ta = document.createElement('textarea');
                    ta.value = resume.email;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    const orig = $('#emailBtn').textContent;
                    $('#emailBtn').textContent = '✅ 已复制';
                    setTimeout(() => { $('#emailBtn').textContent = orig; }, 1800);
                });
            });

            $('#phoneBtn').addEventListener('click', () => {
                const phone = resume.phone;
                navigator.clipboard.writeText(phone).then(() => {
                    const orig = $('#phoneBtn').textContent;
                    $('#phoneBtn').textContent = '✅ 已复制';
                    setTimeout(() => { $('#phoneBtn').textContent = orig; }, 1800);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = phone;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    const orig = $('#phoneBtn').textContent;
                    $('#phoneBtn').textContent = '✅ 已复制';
                    setTimeout(() => { $('#phoneBtn').textContent = orig; }, 1800);
                });
            });
        }

        // ---- 主题切换 ----
        function setupTheme() {
            const btn = $('#themeToggle');
            const html = document.documentElement;
            // 检测系统偏好
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const saved = localStorage.getItem('theme');
            const theme = saved || (prefersDark ? 'dark' : 'light');
            html.setAttribute('data-theme', theme);
            updateThemeIcon(theme);

            btn.addEventListener('click', () => {
                const current = html.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeIcon(next);
            });
        }

        function updateThemeIcon(theme) {
            const btn = $('#themeToggle');
            const isDark = theme === 'dark';
            btn.innerHTML = isDark ?
                `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>` :
                `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
            btn.setAttribute('aria-label', isDark ? '切换到浅色模式' : '切换到深色模式');
        }

        // ---- 打印 ----
        function setupPrint() {
            $('#printBtn').addEventListener('click', () => {
                window.print();
            });
        }

        // ---- 返回顶部 ----
        function setupBackTop() {
            const btn = $('#backTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ---- 初始化 ----
        function init() {
            renderHeroTags();
            renderHeroStats();
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            renderEducation();
            setUpdateTime();
            setupContactButtons();
            setupTheme();
            setupPrint();
            setupBackTop();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
